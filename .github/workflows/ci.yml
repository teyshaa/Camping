name: Build and test

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore HikeManager/HikeManager.sln

      - name: Build solution
        run: dotnet build HikeManager/HikeManager.sln --configuration Release --no-restore

      - name: Run tests and collect coverage
        run: dotnet test HikeManager/HikeManager.sln --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-and-coverage
          path: HikeManager.Tests/TestResults/
          if-no-files-found: warn
          retention-days: 7
